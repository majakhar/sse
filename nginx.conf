events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. HTTP Server - Redirects all HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name sse.mjakhar.in;

        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Server - Handles SSL and Proxies to FastAPI
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name sse.mjakhar.in;

        # Certificate paths from local mounted ./certs folder
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://fastapi_app:8000;

            # HTTP 1.1 Header overrides
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Critical SSE Settings (Disable Buffering & Caching)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
        }
    }
}
