<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Health Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --border: #1f293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 2rem;
      min-height: 100vh;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #eab308;
      transition: background 0.3s;
    }

    #alert-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card h3 {
      font-size: 0.9rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .progress-bar-bg {
      background: #1f293d;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-blue);
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .logs-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .logs-header {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 0.75rem;
    }

    #log-container {
      font-family: monospace;
      font-size: 0.825rem;
      background: #090d16;
      color: #38bdf8;
      padding: 1rem;
      border-radius: 8px;
      height: 160px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .log-entry { margin-bottom: 4px; }
    .log-alert { color: var(--accent-red); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Server Health Monitor</h1>
      <div class="status-badge">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <div id="alert-banner">
      <strong>⚠️ HIGH LOAD ALERT:</strong> <span id="alert-msg"></span>
    </div>

    <div class="grid">
      <div class="card">
        <h3>CPU Usage</h3>
        <div class="stat-value"><span id="cpu-val">0</span>%</div>
        <div class="progress-bar-bg">
          <div id="cpu-bar" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="card">
        <h3>Memory Usage</h3>
        <div class="stat-value"><span id="mem-val">0</span>%</div>
        <small style="color: var(--text-sub);" id="mem-detail">0 / 0 MB</small>
        <div class="progress-bar-bg" style="margin-top: 0.75rem;">
          <div id="mem-bar" class="progress-bar-fill"></div>
        </div>
      </div>
    </div>

    <div class="logs-card">
      <div class="logs-header">Live Event Feed (<span id="last-updated">--:--:--</span>)</div>
      <div id="log-container"></div>
    </div>
  </div>

  <script>
    // Hidden Background Direct API Stream Connection
    const SSE_URL = '/api/server-stats' //'http://sse.mjakhar.in:80/api/server-stats';

    const eventSource = new EventSource(SSE_URL);

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const logContainer = document.getElementById('log-container');

    function addLog(text, isAlert = false) {
      const entry = document.createElement('div');
      entry.className = `log-entry ${isAlert ? 'log-alert' : ''}`;
      entry.innerText = text;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    eventSource.onopen = () => {
      statusDot.style.background = 'var(--accent-green)';
      statusText.innerText = 'Connected (Live SSE)';
      addLog('[System] Connected to background SSE stream.');
    };

    eventSource.onerror = () => {
      statusDot.style.background = 'var(--accent-red)';
      statusText.innerText = 'Reconnecting...';
      addLog('[Error] Connection lost. Auto-retrying...', true);
    };

    eventSource.onmessage = (event) => {
      const stats = JSON.parse(event.data);

      document.getElementById('cpu-val').innerText = stats.cpuUsage;
      const cpuBar = document.getElementById('cpu-bar');
      cpuBar.style.width = `${stats.cpuUsage}%`;
      cpuBar.style.backgroundColor = stats.cpuUsage > 75 ? 'var(--accent-red)' : 'var(--accent-blue)';

      document.getElementById('mem-val').innerText = stats.memoryUsagePercent;
      document.getElementById('mem-detail').innerText = `${stats.usedMemMB} / ${stats.totalMemMB} MB`;
      document.getElementById('mem-bar').style.width = `${stats.memoryUsagePercent}%`;

      document.getElementById('last-updated').innerText = stats.timestamp;

      addLog(`[${stats.timestamp}] CPU: ${stats.cpuUsage}% | RAM: ${stats.memoryUsagePercent}%`);
    };

    eventSource.addEventListener('cpu-alert', (event) => {
      const alertData = JSON.parse(event.data);
      const banner = document.getElementById('alert-banner');
      document.getElementById('alert-msg').innerText = `${alertData.message} at ${alertData.timestamp}`;
      banner.style.display = 'block';

      addLog(`[ALERT] ${alertData.message}`, true);

      setTimeout(() => { banner.style.display = 'none'; }, 4000);
    });
  </script>
</body>
</html>
